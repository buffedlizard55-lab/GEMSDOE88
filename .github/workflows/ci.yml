name: Automated Validation & Gate Suite (15/15 Checks)

on:
  pull_request:
  push:
    branches: ["main", "arena/**"]

permissions:
  contents: read

jobs:
  validate-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore SHA-256 pinned reference grid rasters (.cache/data)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .cache/data
          git clone --filter=blob:none --no-checkout https://x-access-token:${GH_TOKEN}@github.com/buffedlizard55-lab/60GEMSDOE.git /tmp/grid60
          git -C /tmp/grid60 sparse-checkout init --cone
          git -C /tmp/grid60 sparse-checkout set data/official
          git -C /tmp/grid60 checkout 02563d07fb85d2f4d35887503d380d34d4017197
          cp /tmp/grid60/data/official/existing_faults.tif .cache/data/existing_faults.tif
          cp /tmp/grid60/data/official/sample_submission.tif .cache/data/sample_submission.tif
          echo "7ba308ccdc4418b31a178f4f1ef21aaa6e152e4028f2f6f64b01f7eb25ae4093  .cache/data/existing_faults.tif" | sha256sum -c -
          echo "2176d08e485aa2cd2860ce8df539db4faf4d76163b38a4dd8c30a40454d35cbc  .cache/data/sample_submission.tif" | sha256sum -c -

      - name: Run all 15 automated format, physics, canary, uniqueness & link gates
        run: pytest -v tests/test_gems88_gates.py
