name: Automated research release & 15-gate checks
on:
  pull_request:
  push:
    branches: [main, arena/60d7f679-gemsdoe88, arena/7faad4bb-gemsdoe88]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore SHA-pinned grid, .cache/data mirror, and registry witnesses
        run: python scripts/restore_inputs.py --validation
      - name: Run full unified test suite (all 10 test modules)
        run: pytest -v
      - name: Fail-closed submission gate (PROMOTED file must be OK_TO_SUBMIT; exit 0)
        run: |
          python scripts/submission_gate.py --require-submit
          python scripts/render_site.py
          python scripts/check_site.py
          python scripts/readiness.py
          git diff --exit-code docs/status.json docs/data/submission_gate.json index.html docs/index.html docs/executive-summary.html README.md
      - name: Archived ADHR file must stay blocked (literal 17GEMSDOE rule, exit 2)
        run: |
          python scripts/validate_release.py
          set +e
          python scripts/validate_release.py --require-submit
          code=$?
          set -e
          test "$code" -eq 2
