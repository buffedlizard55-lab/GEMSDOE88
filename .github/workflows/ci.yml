name: Automated research release and fail-closed gates
on:
  pull_request:
  push:
    branches: [main, arena/966de778-gemsdoe88]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore SHA-pinned mirrored grid, catalogue and registry witnesses
        run: python scripts/restore_inputs.py --validation
      - name: Run full unified test suite
        run: pytest -v
      - name: Audit site, exact disk bytes and negative current release
        run: |
          python scripts/check_site.py
          python scripts/validate_sarcsd88.py
          if python scripts/validate_sarcsd88.py --require-submit; then echo 'Negative SAR-CSD unexpectedly cleared'; exit 1; else test "$?" -eq 2; fi
          python scripts/validate_kth88.py
          if python scripts/validate_kth88.py --require-submit; then echo 'Negative KTH-88 unexpectedly cleared'; exit 1; else test "$?" -eq 2; fi
          python scripts/readiness.py
          python scripts/validate_current.py
          set +e
          python scripts/validate_current.py --require-submit
          code=$?
          set -e
          test "$code" -eq 2
          python scripts/validate_release.py
          set +e
          python scripts/validate_release.py --require-submit
          code=$?
          set -e
          test "$code" -eq 2
          git diff --exit-code docs/status.json docs/data/current_release.json
