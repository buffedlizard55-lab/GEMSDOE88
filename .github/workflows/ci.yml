name: Automated research release & 15-gate checks
on:
  pull_request:
  push:
    branches: [main, arena/60d7f679-gemsdoe88, arena/7faad4bb-gemsdoe88]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore SHA-pinned grid, .cache/data mirror, and registry witnesses
        run: python scripts/restore_inputs.py --validation
      - name: Run full unified test suite (all 9 test modules)
        run: pytest -v
      - name: Independently reopen published TIFF and verify fail-closed literal gate
        run: |
          python scripts/check_site.py
          python scripts/readiness.py
          python scripts/validate_release.py
          set +e
          python scripts/validate_release.py --require-submit
          code=$?
          set -e
          test "$code" -eq 2
