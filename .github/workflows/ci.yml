name: Automated research release checks
on:
  pull_request:
  push:
    branches: [main, arena/e650459f-gemsdoe88]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore SHA-pinned grid and registry witnesses (not the large feature stack)
        run: python scripts/restore_inputs.py --validation
      - name: Synthetic and end-to-end negative-gate tests
        run: pytest -q
      - name: Independently reopen published TIFF and require negative verdict
        run: |
          python scripts/validate_release.py
          set +e
          python scripts/validate_release.py --require-submit
          code=$?
          set -e
          test "$code" -eq 2
