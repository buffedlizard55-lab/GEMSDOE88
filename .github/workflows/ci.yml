name: Automated research release and fail-closed gates
on:
  pull_request:
  push:
    branches: [main, arena/966de778-gemsdoe88, arena/14b2260c-gemsdoe88]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore SHA-pinned mirrored grid, catalogue and registry witnesses
        run: python scripts/restore_inputs.py --validation
      - name: Audit protocol-integrity regressions without authorizing a slot
        run: |
          python scripts/audit_protocol_integrity.py
          if python scripts/audit_protocol_integrity.py --require-submit; then
            echo 'Protocol-blocked research file unexpectedly cleared'
            exit 1
          else
            test "$?" -eq 2
          fi
          git diff --exit-code evidence/protocol_review_43d08c7a.json docs/data/protocol_review_43d08c7a.json
      - name: Enforce requested literal duplicate-stop policy
        run: |
          python scripts/audit_literal_protocol.py
          set +e
          python scripts/audit_literal_protocol.py --require-submit
          code=$?
          set -e
          test "$code" -eq 2
          git diff --exit-code docs/data/literal_protocol_audit.json evidence/literal_protocol_audit_20261024.json
      - name: Run full unified test suite
        run: pytest -v
      - name: Audit site, exact disk bytes and negative current release
        run: |
          python scripts/audit_literal_protocol.py
          python scripts/validate_mdps88.py
          if python scripts/validate_mdps88.py --require-submit; then echo "Blocked MDPS unexpectedly cleared"; exit 1; else test "$?" -eq 2; fi
          python scripts/check_site.py
          python scripts/validate_sarcsd88.py
          if python scripts/validate_sarcsd88.py --require-submit; then echo 'Negative SAR-CSD unexpectedly cleared'; exit 1; else test "$?" -eq 2; fi
          python scripts/validate_qtsk88.py
          if python scripts/validate_qtsk88.py --require-submit; then echo 'Negative QTSK-88 unexpectedly cleared'; exit 1; else test "$?" -eq 2; fi
          python scripts/validate_kth88.py
          if python scripts/validate_kth88.py --require-submit; then echo 'Negative KTH-88 unexpectedly cleared'; exit 1; else test "$?" -eq 2; fi
          python scripts/validate_phase88.py
          if python scripts/validate_phase88.py --require-submit; then echo 'Negative PHASE-88 unexpectedly cleared'; exit 1; else test "$?" -eq 2; fi
          python scripts/validate_qts88.py
          if python scripts/validate_qts88.py --require-submit; then echo 'Negative QTS-88 unexpectedly cleared'; exit 1; else test "$?" -eq 2; fi
          python scripts/validate_gthc88.py
          if python scripts/validate_gthc88.py --require-submit; then echo 'Negative GTHC-88 unexpectedly cleared'; exit 1; else test "$?" -eq 2; fi
          python scripts/validate_qtsk88.py
          if python scripts/validate_qtsk88.py --require-submit; then echo 'Negative QTSK-88 unexpectedly cleared'; exit 1; else test "$?" -eq 2; fi
          python scripts/validate_bgcd88.py
          if python scripts/validate_bgcd88.py --require-submit; then echo 'Negative BGCD-88 unexpectedly cleared'; exit 1; else test "$?" -eq 2; fi
          python scripts/readiness.py
          python scripts/validate_current.py
          set +e
          python scripts/validate_current.py --require-submit
          code=$?
          set -e
          test "$code" -eq 2
          python scripts/validate_release.py
          set +e
          python scripts/validate_release.py --require-submit
          code=$?
          set -e
          test "$code" -eq 2
          git diff --exit-code docs/status.json docs/data/current_release.json
