name: Automated research release and fail-closed gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore SHA-pinned grid and expanded registry
        run: |
          python scripts/restore_inputs.py --validation
          python scripts/restore_siblings.py
      - name: Run full unified test suite
        run: pytest -v
      - name: Audit current release and retained negative artifacts
        run: |
          python scripts/check_site.py
          python scripts/validate_kth88.py
          python scripts/validate_phase88.py
          if python scripts/validate_phase88.py --require-submit; then echo 'Negative PHASE-88 unexpectedly cleared'; exit 1; else test "$?" -eq 2; fi
          python scripts/validate_mdps88.py
          if python scripts/validate_mdps88.py --require-submit; then echo 'Negative MDPS-88 unexpectedly cleared'; exit 1; else test "$?" -eq 2; fi
          python scripts/readiness.py
          python scripts/validate_current.py
          set +e
          python scripts/validate_current.py --require-submit
          code=$?
          set -e
          test "$code" -eq 2
          python scripts/validate_release.py
          set +e
          python scripts/validate_release.py --require-submit
          code=$?
          set -e
          test "$code" -eq 2
          git diff --exit-code docs/status.json docs/data/current_release.json docs/data/phase88_validation.json docs/data/mdps88_validation.json evidence/mdps88_independent_audit_20261024.json
