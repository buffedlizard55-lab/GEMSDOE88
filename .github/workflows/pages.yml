name: Static Pages site deploy (no automated DrivenData scrape per Terms of Use)
on:
  push:
    branches: [main]
    paths: ['docs/**', 'registry/**', 'scripts/**', 'src/**', 'vendor/**', '.github/workflows/pages.yml', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/restore_inputs.py --validation
      - name: Reopen every research TIFF/ZIP and verify the canonical negative UI
        run: |
          python scripts/audit_downloads.py --check
          python scripts/render_decision.py --check
          python -O scripts/check_site.py
      - name: Re-run autonomous 2026-10-25 review and keep its machine card fail-closed
        run: |
          python scripts/review_repo_20261025.py
          set +e
          python scripts/review_repo_20261025.py --require-submit
          code=$?
          set -e
          test "$code" -eq 2
          git diff --exit-code evidence/repo_review_20261025.json docs/data/repo_review_20261025.json
      - name: Audit protocol-integrity regressions without authorizing a slot
        run: |
          python scripts/audit_protocol_integrity.py
          if python scripts/audit_protocol_integrity.py --require-submit; then
            echo 'Protocol-blocked research file unexpectedly cleared'
            exit 1
          else
            test "$?" -eq 2
          fi
          git diff --exit-code evidence/protocol_review_43d08c7a.json docs/data/protocol_review_43d08c7a.json
      - name: Enforce requested literal duplicate-stop policy
        run: |
          python scripts/audit_literal_protocol.py
          set +e
          python scripts/audit_literal_protocol.py --require-submit
          code=$?
          set -e
          test "$code" -eq 2
          git diff --exit-code docs/data/literal_protocol_audit.json evidence/literal_protocol_audit_20261024.json
      - name: Recompute H88-MTAS universal pre-placement stop; reject any generation
        run: |
          python scripts/preflight_mtas88.py
          if python scripts/preflight_mtas88.py --gate-generation; then
            echo 'MTAS unexpectedly allowed a new candidate'
            exit 1
          else
            test "$?" -eq 2
          fi
          git diff --exit-code registry/mtas88_run_card.json docs/data/mtas88_run_card.json evidence/mtas88_preflight_20261025.json
      - run: pytest -q
      - name: Refuse to deploy a contradictory or corrupted research release
        run: |
          python scripts/audit_literal_protocol.py
          python scripts/validate_mdps88.py
          if python scripts/validate_mdps88.py --require-submit; then echo "Blocked MDPS unexpectedly cleared"; exit 1; else test "$?" -eq 2; fi
          python scripts/check_site.py
          python scripts/validate_hgvc88.py
          if python scripts/validate_hgvc88.py --require-submit; then echo 'Negative HGVC unexpectedly cleared'; exit 1; else test "$?" -eq 2; fi
          python scripts/validate_gzzc88.py
          if python scripts/validate_gzzc88.py --require-submit; then echo 'Negative GZZC unexpectedly cleared'; exit 1; else test "$?" -eq 2; fi
          python scripts/readiness.py
          python scripts/validate_current.py
          python scripts/validate_release.py
          python scripts/validate_kth88.py
          python scripts/validate_phase88.py
          if python scripts/validate_phase88.py --require-submit; then echo 'Negative PHASE-88 unexpectedly cleared'; exit 1; else test "$?" -eq 2; fi
          python scripts/validate_bgcd88.py
          if python scripts/validate_bgcd88.py --require-submit; then echo 'Negative BGCD-88 unexpectedly cleared'; exit 1; else test "$?" -eq 2; fi
          git diff --exit-code docs/status.json docs/data/current_release.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy without pushing a Git branch
        id: deployment
        uses: actions/deploy-pages@v4
