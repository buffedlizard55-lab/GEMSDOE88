name: Static Pages site deploy (no automated DrivenData scrape per Terms of Use)
on:
  push:
    branches: [main]
    paths: ['docs/**', 'evidence/**', 'registry/**', 'research/**', 'scripts/**', 'src/**', 'vendor/**', '.github/workflows/pages.yml', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore expanded SHA-pinned registry
        run: |
          python scripts/restore_inputs.py --validation
          python scripts/restore_siblings.py
      - run: pytest -q
      - name: Refuse to deploy contradictory or corrupted releases
        run: |
          python scripts/check_site.py
          python scripts/validate_kth88.py
          python scripts/validate_phase88.py
          if python scripts/validate_phase88.py --require-submit; then echo 'Negative PHASE-88 unexpectedly cleared'; exit 1; else test "$?" -eq 2; fi
          python scripts/validate_mdps88.py
          if python scripts/validate_mdps88.py --require-submit; then echo 'Negative MDPS-88 unexpectedly cleared'; exit 1; else test "$?" -eq 2; fi
          python scripts/readiness.py
          python scripts/validate_current.py
          set +e
          python scripts/validate_current.py --require-submit
          code=$?
          set -e
          test "$code" -eq 2
          python scripts/validate_release.py
          git diff --exit-code docs/status.json docs/data/current_release.json docs/data/phase88_validation.json docs/data/mdps88_validation.json evidence/mdps88_independent_audit_20261024.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy without pushing a Git branch
        id: deployment
        uses: actions/deploy-pages@v4
