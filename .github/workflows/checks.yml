name: Evidence and software checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/restore_inputs.py --validation
      - name: Reopen every research TIFF/ZIP and verify the canonical negative UI
        run: |
          python scripts/audit_downloads.py --check
          python scripts/render_decision.py --check
          python -O scripts/check_site.py
      - name: Re-run autonomous 2026-10-25 review and keep its machine card fail-closed
        run: |
          python scripts/review_repo_20261025.py
          set +e
          python scripts/review_repo_20261025.py --require-submit
          code=$?
          set -e
          test "$code" -eq 2
          git diff --exit-code evidence/repo_review_20261025.json docs/data/repo_review_20261025.json
      - name: Fresh dated review must reject submission clearance
        run: |
          python scripts/review_submission_status.py
          if python scripts/review_submission_status.py --require-submit; then
            echo 'Blocked research artifact unexpectedly cleared'
            exit 1
          else
            test "$?" -eq 2
          fi
      - name: Audit protocol-integrity regressions without authorizing a slot
        run: |
          python scripts/audit_protocol_integrity.py
          if python scripts/audit_protocol_integrity.py --require-submit; then
            echo 'Protocol-blocked research file unexpectedly cleared'
            exit 1
          else
            test "$?" -eq 2
          fi
          git diff --exit-code evidence/protocol_review_43d08c7a.json docs/data/protocol_review_43d08c7a.json
      - name: Enforce requested literal duplicate-stop policy
        run: |
          python scripts/audit_literal_protocol.py
          set +e
          python scripts/audit_literal_protocol.py --require-submit
          code=$?
          set -e
          test "$code" -eq 2
          git diff --exit-code docs/data/literal_protocol_audit.json evidence/literal_protocol_audit_20261024.json
      - name: Recompute H88-MTAS universal pre-placement stop; reject any generation
        run: |
          python scripts/preflight_mtas88.py
          if python scripts/preflight_mtas88.py --gate-generation; then
            echo 'MTAS unexpectedly allowed a new candidate'
            exit 1
          else
            test "$?" -eq 2
          fi
          git diff --exit-code registry/mtas88_run_card.json docs/data/mtas88_run_card.json evidence/mtas88_preflight_20261025.json
      - run: python -m pytest -q
      - run: python scripts/audit_literal_protocol.py
      - run: python scripts/validate_mdps88.py
      - run: python scripts/check_site.py
      - name: Site guard remains active with optimized Python
        run: python -O scripts/check_site.py
      - name: Independently validate H88-HGVC TIFF and ZIP; reject competition slot
        run: |
          python scripts/validate_hgvc88.py
          if python scripts/validate_hgvc88.py --require-submit; then echo 'Negative HGVC unexpectedly cleared'; exit 1; else test "$?" -eq 2; fi
      - name: Independently validate H88-SAR-CSD TIFF and ZIP; reject competition slot
        run: |
          python scripts/validate_sarcsd88.py
          if python scripts/validate_sarcsd88.py --require-submit; then echo 'Negative SAR-CSD unexpectedly cleared'; exit 1; else test "$?" -eq 2; fi
      - name: Independently validate H88-QTSK TIFF and ZIP; reject competition slot
        run: |
          python scripts/validate_qtsk88.py
          if python scripts/validate_qtsk88.py --require-submit; then echo 'Negative QTSK-88 unexpectedly cleared'; exit 1; else test "$?" -eq 2; fi
      - name: Independently validate KTH-88 TIFF and ZIP; reject competition slot
        run: |
          python scripts/validate_kth88.py
          if python scripts/validate_kth88.py --require-submit; then echo 'Negative KTH-88 unexpectedly cleared'; exit 1; else test "$?" -eq 2; fi
      - name: Independently validate H88-LSC TIFF and ZIP; reject competition slot
        run: |
          python scripts/validate_lsc88.py
          if python scripts/validate_lsc88.py --require-submit; then echo 'Negative LSC-88 unexpectedly cleared'; exit 1; else test "$?" -eq 2; fi
      - run: python scripts/readiness.py
      - name: Independently recheck the CURRENT release and expected negative slot gate
        run: |
          python scripts/validate_current.py
          set +e
          python scripts/validate_current.py --require-submit
          code=$?
          set -e
          test "$code" -eq 2
      - name: Gate v3 recheck of every candidate (fail-closed; expected exit 2 while no file clears all gates)
        run: |
          python scripts/validate_release.py
          set +e
          python scripts/validate_release.py --require-submit
          code=$?
          set -e
          test "$code" -eq 2
      - name: Independently recheck QTS-88 research deliverable and expected negative slot gate
        run: |
          python scripts/validate_qts88.py
          set +e
          python scripts/validate_qts88.py --require-submit
          code=$?
          set -e
          test "$code" -eq 2
      - name: Independently recheck GTHC-88 research deliverable and expected negative slot gate
        run: |
          python scripts/validate_gthc88.py
          set +e
          python scripts/validate_gthc88.py --require-submit
          code=$?
          set -e
          test "$code" -eq 2
      - name: Independently recheck H88-QTSK research deliverable and expected negative slot gate
        run: |
          python scripts/validate_qtsk88.py
          set +e
          python scripts/validate_qtsk88.py --require-submit
          code=$?
          set -e
          test "$code" -eq 2
      - name: Independently recheck H88-BGCD research deliverable and expected negative slot gate
        run: |
          python scripts/validate_bgcd88.py
          set +e
          python scripts/validate_bgcd88.py --require-submit
          code=$?
          set -e
          test "$code" -eq 2
      - name: Independently recheck H88-MFS research deliverable and expected negative slot gate
        run: |
          python scripts/validate_mfs88.py
          set +e
          python scripts/validate_mfs88.py --require-submit
          code=$?
          set -e
          test "$code" -eq 2
      - name: Independently recheck H88-VHGD research deliverable and expected negative slot gate
        run: |
          python scripts/validate_vhgd88.py
          set +e
          python scripts/validate_vhgd88.py --require-submit
          code=$?
          set -e
          test "$code" -eq 2
      - name: Independently recheck H88-BPWD research deliverable and expected negative slot gate
        run: |
          python scripts/validate_bpwd88.py
          set +e
          python scripts/validate_bpwd88.py --require-submit
          code=$?
          set -e
          test "$code" -eq 2
      - name: Independently recheck H88-VCAZ research deliverable and expected negative slot gate
        run: |
          python scripts/validate_vcaz88.py
          set +e
          python scripts/validate_vcaz88.py --require-submit
          code=$?
          set -e
          test "$code" -eq 2
      - run: git diff --exit-code docs/status.json docs/data/current_release.json registry/template_pin.json
