name: Evidence and software checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/restore_inputs.py --validation
      - run: python -m pytest -q
      - run: python scripts/check_site.py
      - run: python scripts/readiness.py
      - run: python scripts/validate_release.py
      - run: python scripts/submission_gate.py --require-submit
      - run: git diff --exit-code docs/status.json docs/run_card.json registry/template_pin.json
